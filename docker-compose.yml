services:
  app:
    build: .
    image: knowledge-inbox:latest
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_PATH: /data/knowledge-inbox.db
      # Passed through from your shell or a local .env file. Set one key; the
      # base URL and models are defaulted per provider. Leave both unset to run
      # in the offline fallback mode.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
    volumes:
      # SQLite must outlive the container, so the database is a named volume
      # rather than a file inside the image layer.
      - knowledge-inbox-data:/data
    restart: unless-stopped

volumes:
  knowledge-inbox-data:
