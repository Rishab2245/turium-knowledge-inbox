# One-click deploy on Render: the Dockerfile builds both halves and the Node
# process serves the API and the built frontend from a single origin.
services:
  - type: web
    name: knowledge-inbox
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/knowledge-inbox.db
      # Set one of these in the dashboard after the first deploy; never
      # committed. The base URL and models are defaulted per provider, so the
      # key is the only thing needed. With neither, the service still runs in
      # its offline fallback mode.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      # SQLite needs a real disk. Without this the database is wiped on every
      # deploy, which is the single most common way this stack surprises people.
      name: knowledge-inbox-data
      mountPath: /data
      sizeGB: 1
