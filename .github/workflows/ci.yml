name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck both workspaces
        run: npm run typecheck

      - name: Test
        # Both workspaces. No credentials and no network: the backend suite stubs
        # the model providers and runs against an in-memory SQLite database, and
        # the frontend suite stubs fetch in jsdom.
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Build and publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        # Container registries require a lowercase repository name, and the
        # GitHub org/user casing is not guaranteed to be lowercase.
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build the image to prove the Dockerfile is not broken,
          # but only main publishes it.
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name inbox -p 4000:4000 "$IMAGE"

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then
              echo "API is healthy"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API never became healthy"
              docker logs inbox
              exit 1
            fi
            sleep 2
          done

          # Prove the whole pipeline works in the shipped image, not just that
          # the process starts: ingest, wait for indexing, then ask.
          curl -fsS -X POST http://localhost:4000/api/ingest \
            -H 'content-type: application/json' \
            -d '{"type":"note","content":"The ingestion queue persists job state in SQLite so an interrupted ingest is recoverable."}' > /dev/null

          for attempt in $(seq 1 15); do
            ready=$(curl -fsS http://localhost:4000/api/health | grep -o '"ready":[0-9]*' | head -1 | cut -d: -f2)
            [ "$ready" = "1" ] && break
            [ "$attempt" -eq 15 ] && { echo "item never finished indexing"; docker logs inbox; exit 1; }
            sleep 2
          done

          curl -fsS -X POST http://localhost:4000/api/query \
            -H 'content-type: application/json' \
            -d '{"question":"where is ingest job state persisted?"}' | tee answer.json

          grep -q '"citations":\[{' answer.json || { echo "query returned no citations"; docker logs inbox; exit 1; }

          # The SPA must be served from the same origin in the production image.
          curl -fsS http://localhost:4000/ | grep -q 'AI Knowledge Inbox'

          echo "Image smoke test passed"
          docker rm -f inbox
